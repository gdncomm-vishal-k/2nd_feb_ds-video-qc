[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ds-video-qc"
version = "1.0.0"
description = "Video Quality Control API for processing and validating video content"
readme = "README.md"
authors = []  # Add your name/email if desired
packages = [
    { include = "src" },
    { include = "configs" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
# Web framework & server
fastapi = "0.115.5"
uvicorn = { version = "0.32.1", extras = ["standard"] }
# Async HTTP
aiohttp = "3.10.10"
httpx = "0.27.2"
# Validation & schemas
pydantic = "2.10.2"
# Image & numerical
numpy = "1.26.4"
Pillow = "10.4.0"
# Google Cloud (auth + Vertex AI / Gemini)
google-auth = "2.36.0"
vertexai = "1.71.1"
# Speech-to-text
faster-whisper = "1.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"
pytest-cov = "4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "configs", "."]
